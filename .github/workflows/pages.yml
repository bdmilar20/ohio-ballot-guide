# Publishes the repository root to GitHub Pages. The site is static with no
# build step, so the artifact is the checkout itself.
#
# This needs Pages turned on once, by hand, with Settings -> Pages -> Build and
# deployment -> Source: GitHub Actions. Until then this workflow fails at the
# deploy step and nothing is published.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing at workflow scope beyond reading the checkout. A workflow-level
# `pages: write` / `id-token: write` would flow into the reusable check
# workflow too, handing the test job authority to publish; GitHub passes
# caller permissions into a called workflow unless the calling job narrows
# them. Only `deploy` asks for deploy authority.
permissions:
  contents: read

# Never let two deploys race; let an in-flight one finish rather than
# cancelling it, so a half-published site is not a possible state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
